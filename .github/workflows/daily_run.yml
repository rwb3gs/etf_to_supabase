name: Daily ETF Data Sync

on:
  schedule:
    # 每天台灣時間 18:30 自動執行 (格林威治時間 10:30 UTC)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動按按鈕觸發執行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4  # 升級至 v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5  # 升級至 v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行更新腳本
        run: python etf_to_supabase.py
